apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
      - name: gitlab
        image: gitlab/gitlab-ce:18.10.1-ce.0
        ports:
        - containerPort: 80
        - containerPort: 443
        env:
        - name: GITLAB_OMNIBUS_CONFIG
          value: |
            external_url 'https://gitlab.tamlabs.co.uk'
            gitlab_rails['gitlab_shell_ssh_port'] = 22
        volumeMounts:
        - mountPath: /var/opt/gitlab
          name: gitlab-storage
      volumes:
      - name: gitlab-storage
        persistentVolumeClaim:
          claimName: gitlab-pvc
