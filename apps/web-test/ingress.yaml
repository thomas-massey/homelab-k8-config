apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-test
  namespace: webtest
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - web-test.tamlabs.co.uk
      secretName: web-test-tls
  rules:
    - host: web-test.tamlabs.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80