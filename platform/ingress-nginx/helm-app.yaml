apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.3
    helm:
      values: |
        controller:
          replicaCount: 1

          nodeSelector:
            ingress-ready: "true"

          tolerations:
            - key: "ingress"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"

          service:
            type: NodePort

          ingressClassResource:
            default: true

          admissionWebhooks:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true